name: Production health

on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:

# No database secrets, checkout, third-party actions, artifacts or caches.
permissions:
  actions: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Detect a missed daily check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/production-health.yml/runs?per_page=20`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('Cannot verify scheduler history');
            const { workflow_runs: runs } = await response.json();
            const previous = runs.find(run => String(run.id) !== process.env.RUN_ID && run.status === 'completed');
            const hours = previous ? (Date.now() - Date.parse(previous.created_at)) / 3600000 : null;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Scheduler\n${hours === null ? 'First run: establishing monitoring history.' : `Previous completed check: ${previous.created_at} (${hours.toFixed(1)} hours ago).`}\n`);
            if (hours !== null && hours > 26) throw new Error('No completed production health check in the previous 26 hours');
          })().catch(() => {
            console.error('::error::Scheduler history unavailable or a daily check was missed. Inspect prior runs and re-enable the workflow if needed.');
            process.exitCode = 1;
          });
          NODE
      - name: Read production database through hosted Padova
        if: always()
        run: |
          # Allow a sleeping Render Free instance to wake. No redirects to another host.
          success=0
          for attempt in 1 2 3; do
            if curl --silent --fail --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 \
              'https://padova-production.onrender.com/api/health' --output /tmp/padova-health.json; then
              success=1
              break
            fi
            sleep 10
          done
          if [ "$success" != 1 ]; then
            echo '::error::Hosted Padova or its production database is unreachable after three attempts.'
            echo '## FAILED: hosted application / production database unreachable' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          try {
            const health = JSON.parse(fs.readFileSync('/tmp/padova-health.json', 'utf8'));
            const age = Date.now() - Date.parse(health.checkedAt);
            if (health.status !== 'healthy' || health.application !== 'reachable' || health.database !== 'reachable' ||
                health.projectRef !== 'unugynfzmxjxifgofxjr' || !Number.isFinite(age) || age < -60000 || age > 300000)
              throw new Error('Invalid or stale production health response');
            const summary = `## PASS\nHosted Padova: reachable\n\nProduction Supabase: reachable (real, read-only schema-marker query)\n\nProject: unugynfzmxjxifgofxjr\n\nDatabase check: ${health.checkedAt}\n\nQA: not contacted. Financial data: unchanged.\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          } catch {
            console.error('::error::Invalid, stale or non-production health response. No response body or secrets logged.');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## FAILED: invalid, stale or non-production database health response\n');
            process.exitCode = 1;
          }
          NODE
